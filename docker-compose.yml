services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freep_pipeline}
      POSTGRES_USER: ${POSTGRES_USER:-freep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freep-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --http-enabled=true --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-this-local-password}
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./docker/keycloak/dreev-realm.json:/opt/keycloak/data/import/dreev-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/dreev HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  keycloak-init:
    image: quay.io/keycloak/keycloak:25.0
    entrypoint: ["/bin/sh", "/scripts/init-secrets.sh"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-this-local-password}
      KEYCLOAK_REVIEWER_CLIENT_SECRET: ${KEYCLOAK_REVIEWER_CLIENT_SECRET:?set KEYCLOAK_REVIEWER_CLIENT_SECRET in .env}
      FREEP_TEST_CLIENT_SECRET: ${FREEP_TEST_CLIENT_SECRET:?set FREEP_TEST_CLIENT_SECRET in .env}
      REVIEWER_USERNAME: ${REVIEWER_USERNAME:-reviewer}
      REVIEWER_PASSWORD: ${REVIEWER_PASSWORD:?set REVIEWER_PASSWORD in .env}
      REVIEWER_EMAIL: ${REVIEWER_EMAIL:-reviewer@dreev.local}
      REVIEWER_FIRST_NAME: ${REVIEWER_FIRST_NAME:-Freep}
      REVIEWER_LAST_NAME: ${REVIEWER_LAST_NAME:-Reviewer}
    volumes:
      - ./docker/keycloak/init-secrets.sh:/scripts/init-secrets.sh:ro
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/freep-ict-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-freep}:${POSTGRES_PASSWORD:-freep-local}@db:5432/${POSTGRES_DB:-freep_pipeline}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KEYCLOAK_ISSUER_URL: http://keycloak:8080/realms/dreev
      KEYCLOAK_API_AUDIENCE: ${KEYCLOAK_API_AUDIENCE:-freep-pipeline-api}
      KEYCLOAK_REVIEWER_CLIENT_ID: ${KEYCLOAK_REVIEWER_CLIENT_ID:-freep-reviewer-ui}
      KEYCLOAK_REVIEWER_CLIENT_SECRET: ${KEYCLOAK_REVIEWER_CLIENT_SECRET:-changeme}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully
    volumes:
      - backend_logs:/app/logs
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/freep-ict-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./freep-ict-job-pipeline
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-localhost}
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  ollama:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/freep-ict-ollama:${IMAGE_TAG:-latest}
    build:
      context: ./docker/ollama
      dockerfile: Dockerfile
      args:
        OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
    profiles: ["llm"]
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped

volumes:
  postgres_data:
  keycloak_data:
  backend_logs:
  caddy_data:
  caddy_config: