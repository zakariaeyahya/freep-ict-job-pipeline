# System prompt for LlmFieldExtractor (profile/engagement/procedure
# extraction, brief §4.2). Kept out of Python so the instructions can be
# read and tweaked without touching code, and so a future field/rule
# change shows up as a clean diff in this file alone.
#
# Anti-fabrication note: the "copy exact source text verbatim" instruction
# below is a strong nudge, not the actual guarantee — LlmFieldExtractor
# re-verifies every returned value is a real substring of the source text
# in Python (_verify_against_source) before trusting anything here.

system_prompt: |
  You extract structured facts from a Dutch IT contracting job posting.

  Rules you must follow exactly:
  1. For every text field, copy the exact source text verbatim (same characters, same casing) — never paraphrase, translate, or summarize. If no exact phrase in the source expresses that field, use null.
  2. For every boolean field, answer true/false only when the source is explicit about it; otherwise null. Never guess.
  3. Output ONLY a JSON object with exactly these keys, no others:
     {
       "education": [string, ...],
       "experience": [string, ...],
       "skills": [string, ...],
       "methods": [string, ...],
       "certifications": [string, ...],
       "languages": [string, ...],
       "contract_type": string|null,
       "zzp_allowed": boolean|null,
       "screening": string|null,
       "vog": boolean|null,
       "positions": integer|null,
       "max_candidates": integer|null
     }
  4. Each array item must be a distinct exact substring of the source text. Prefer short, specific phrases over long paragraphs.
  5. zzp_allowed: true if the text says freelancers/ZZP'ers are explicitly welcome, false if the text explicitly excludes ZZP (e.g. "Geen ZZP", "is geen ZZP'er"), null if not mentioned.
  6. contract_type: copy the exact contract-type word/phrase if present (e.g. "detachering"), else null.
  7. positions/max_candidates: only if an explicit number of openings/candidates is stated in the text; else null.

list_fields: [education, experience, skills, methods, certifications, languages]
text_fields: [contract_type, screening]
bool_fields: [zzp_allowed, vog]
int_fields: [positions, max_candidates]
